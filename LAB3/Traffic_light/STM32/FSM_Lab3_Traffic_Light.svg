<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .panelTitle { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .nodeTitle { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .nodeText { font: 400 14px Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .edgeBlue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .edgeLabel { font: 600 13px Arial, sans-serif; fill: #1e293b; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #475569; }
      .note { font: 400 14px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1800" height="1500" fill="#f8fafc"/>
  <text x="70" y="58" class="title">FSM Lab 3 — Hệ thống đèn giao thông ngã tư</text>
  <text x="70" y="88" class="subtitle">Sơ đồ được suy ra từ input_processing.c: FSM nút nhấn/chế độ và FSM điều khiển đèn trong MODE_1_NORMAL</text>

  <rect x="45" y="120" width="805" height="1325" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="165" class="panelTitle">A. FSM xử lý nút nhấn và chọn chế độ</text>
  <text x="75" y="194" class="small">fsm_for_input_processing() chạy trong super loop; button_reading() cập nhật dữ liệu đã debounce mỗi 10 ms</text>

  <rect x="75" y="225" width="745" height="330" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="100" y="262" class="nodeTitle">FSM chế độ hoạt động — biến mode</text>
  <text x="100" y="288" class="small">BTN1 tại trạng thái nhấn hợp lệ: mode++ ; MODE_4_GREEN quay lại MODE_1_NORMAL</text>

  <rect x="100" y="335" width="145" height="100" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="172" y="367" text-anchor="middle" class="nodeTitle">MODE_1_NORMAL</text>
  <text x="172" y="391" text-anchor="middle" class="nodeText">Chạy traffic FSM</text>
  <text x="172" y="412" text-anchor="middle" class="nodeText">BTN1 → MODE_2</text>

  <rect x="295" y="335" width="145" height="100" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="367" y="367" text-anchor="middle" class="nodeTitle">MODE_2_RED</text>
  <text x="367" y="391" text-anchor="middle" class="nodeText">Nhấp nháy LED đỏ</text>
  <text x="367" y="412" text-anchor="middle" class="nodeText">Chỉnh time_red</text>

  <rect x="490" y="335" width="145" height="100" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="562" y="367" text-anchor="middle" class="nodeTitle">MODE_3_AMBER</text>
  <text x="562" y="391" text-anchor="middle" class="nodeText">Nhấp nháy LED vàng</text>
  <text x="562" y="412" text-anchor="middle" class="nodeText">Chỉnh time_amber</text>

  <rect x="685" y="335" width="115" height="100" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="742" y="367" text-anchor="middle" class="nodeTitle">MODE_4_GREEN</text>
  <text x="742" y="391" text-anchor="middle" class="nodeText">Nhấp nháy LED xanh</text>
  <text x="742" y="412" text-anchor="middle" class="nodeText">Chỉnh time_green</text>

  <path d="M245 385 L295 385" class="edgeBlue"/>
  <text x="270" y="373" text-anchor="middle" class="edgeLabel">BTN1</text>
  <path d="M440 385 L490 385" class="edgeBlue"/>
  <text x="465" y="373" text-anchor="middle" class="edgeLabel">BTN1</text>
  <path d="M635 385 L685 385" class="edgeBlue"/>
  <text x="660" y="373" text-anchor="middle" class="edgeLabel">BTN1</text>
  <path d="M742 435 C742 505 172 505 172 435" class="edgeBlue"/>
  <text x="455" y="530" text-anchor="middle" class="edgeLabel">BTN1 từ MODE_4 → MODE_1</text>

  <rect x="75" y="590" width="745" height="425" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="100" y="628" class="nodeTitle">FSM trạng thái của mỗi nút nhấn — buttonState[i]</text>
  <text x="100" y="654" class="small">Có 3 trạng thái; bộ lọc hai mẫu trong input_reading.c loại bỏ phần lớn nhiễu dội phím</text>

  <rect x="120" y="735" width="175" height="110" rx="55" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="207" y="770" text-anchor="middle" class="nodeTitle">BUTTON_RELEASED</text>
  <text x="207" y="795" text-anchor="middle" class="nodeText">Chưa nhấn</text>
  <text x="207" y="817" text-anchor="middle" class="nodeText">is_button_pressed = 1</text>

  <rect x="385" y="735" width="175" height="110" rx="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="472" y="770" text-anchor="middle" class="nodeTitle">BUTTON_PRESSED</text>
  <text x="472" y="795" text-anchor="middle" class="nodeText">Xử lý một lần nhấn</text>
  <text x="472" y="817" text-anchor="middle" class="nodeText">gọi handle_button_press(i)</text>

  <rect x="650" y="735" width="145" height="110" rx="55" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="722" y="765" text-anchor="middle" class="nodeTitle">PRESSED</text>
  <text x="722" y="786" text-anchor="middle" class="nodeTitle">&gt; 1 SECOND</text>
  <text x="722" y="811" text-anchor="middle" class="nodeText">BTN2 tự tăng</text>
  <text x="722" y="830" text-anchor="middle" class="nodeText">mỗi 500 ms</text>

  <path d="M295 790 L385 790" class="edge"/>
  <text x="340" y="778" text-anchor="middle" class="edgeLabel">nhấn hợp lệ</text>
  <path d="M560 790 L650 790" class="edge"/>
  <text x="605" y="778" text-anchor="middle" class="edgeLabel">giữ ≥ 1 s</text>
  <path d="M385 825 C330 900 270 900 207 845" class="edge"/>
  <text x="300" y="925" text-anchor="middle" class="edgeLabel">nhả nút</text>
  <path d="M650 825 C580 950 400 955 295 820" class="edge"/>
  <text x="470" y="975" text-anchor="middle" class="edgeLabel">nhả nút</text>
  <path d="M795 760 C830 700 830 675 722 675 C680 675 650 700 650 735" class="edge"/>
  <text x="760" y="660" text-anchor="middle" class="edgeLabel">BTN2 &amp;&amp; timer_flag[3]</text>

  <rect x="75" y="1050" width="745" height="365" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="100" y="1088" class="nodeTitle">Sự kiện theo từng mode</text>
  <text x="105" y="1125" class="note">BTN1: chuyển tuần tự MODE_1 → MODE_2 → MODE_3 → MODE_4 → MODE_1.</text>
  <text x="105" y="1155" class="note">BTN2: khi mode ≠ MODE_1, tăng temp_value từ 1 đến 99 rồi quay về 1.</text>
  <text x="105" y="1185" class="note">BTN3: lưu temp_value vào thời gian màu tương ứng và cân bằng:</text>
  <text x="130" y="1215" class="note">time_red = time_green + time_amber.</text>
  <text x="105" y="1255" class="note">MODE_1: gọi fsm_traffic_normal(); MODE_2/3/4: gọi blinkLedsMode(mode).</text>
  <text x="105" y="1295" class="small">Ghi chú: Khi chuyển về MODE_1, trafficState được đặt INIT_TRAFFIC để khởi động lại chu kỳ.</text>

  <rect x="875" y="120" width="880" height="1325" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="905" y="165" class="panelTitle">B. FSM đèn giao thông trong MODE_1_NORMAL</text>
  <text x="905" y="194" class="small">fsm_traffic_normal(): mỗi timer_flag[0] tương ứng 1 giây; mỗi trạng thái điều khiển cả hai đường</text>

  <rect x="1230" y="245" width="170" height="100" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="1315" y="278" text-anchor="middle" class="nodeTitle">INIT_TRAFFIC</text>
  <text x="1315" y="303" text-anchor="middle" class="nodeText">Nạp bộ đếm</text>
  <text x="1315" y="324" text-anchor="middle" class="nodeText">bật R1 + G2</text>

  <rect x="930" y="480" width="235" height="125" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1047" y="516" text-anchor="middle" class="nodeTitle">RED1_GREEN2</text>
  <text x="1047" y="541" text-anchor="middle" class="nodeText">R1 ON, G2 ON</text>
  <text x="1047" y="565" text-anchor="middle" class="nodeText">count_road1--</text>
  <text x="1047" y="585" text-anchor="middle" class="nodeText">count_road2--</text>

  <rect x="1465" y="480" width="235" height="125" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="1582" y="516" text-anchor="middle" class="nodeTitle">RED1_AMBER2</text>
  <text x="1582" y="541" text-anchor="middle" class="nodeText">R1 ON, Y2 ON</text>
  <text x="1582" y="565" text-anchor="middle" class="nodeText">count_road1--</text>
  <text x="1582" y="585" text-anchor="middle" class="nodeText">count_road2--</text>

  <rect x="1465" y="800" width="235" height="125" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1582" y="836" text-anchor="middle" class="nodeTitle">GREEN1_RED2</text>
  <text x="1582" y="861" text-anchor="middle" class="nodeText">G1 ON, R2 ON</text>
  <text x="1582" y="885" text-anchor="middle" class="nodeText">count_road1--</text>
  <text x="1582" y="905" text-anchor="middle" class="nodeText">count_road2--</text>

  <rect x="930" y="800" width="235" height="125" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="1047" y="836" text-anchor="middle" class="nodeTitle">AMBER1_RED2</text>
  <text x="1047" y="861" text-anchor="middle" class="nodeText">Y1 ON, R2 ON</text>
  <text x="1047" y="885" text-anchor="middle" class="nodeText">count_road1--</text>
  <text x="1047" y="905" text-anchor="middle" class="nodeText">count_road2--</text>

  <path d="M1315 345 L1150 480" class="edge"/>
  <text x="1250" y="407" class="edgeLabel">khởi tạo</text>
  <path d="M1165 542 L1465 542" class="edge"/>
  <text x="1315" y="530" text-anchor="middle" class="edgeLabel">timer_flag[0] &amp;&amp; count_road2 ≤ 0</text>
  <path d="M1582 605 L1582 800" class="edge"/>
  <text x="1600" y="710" class="edgeLabel">timer_flag[0] &amp;&amp; (count_road1 ≤ 0 || count_road2 ≤ 0)</text>
  <path d="M1465 862 L1165 862" class="edge"/>
  <text x="1315" y="850" text-anchor="middle" class="edgeLabel">timer_flag[0] &amp;&amp; count_road1 ≤ 0</text>
  <path d="M930 800 C820 700 820 600 930 540" class="edge"/>
  <text x="820" y="690" text-anchor="middle" class="edgeLabel">timer_flag[0] &amp;&amp; (count_road1 ≤ 0 || count_road2 ≤ 0)</text>

  <path d="M1315 245 C1190 170 960 170 930 480" class="edge"/>
  <text x="1060" y="214" text-anchor="middle" class="edgeLabel">default → INIT_TRAFFIC</text>

  <rect x="925" y="1010" width="780" height="385" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="950" y="1050" class="nodeTitle">Hoạt động tại mỗi chuyển trạng thái</text>
  <text x="955" y="1088" class="note">1. setTimer(0, 1000) để tạo nhịp cập nhật 1 giây.</text>
  <text x="955" y="1122" class="note">2. Cập nhật count_road1 và count_road2 rồi gọi updateClockBuffer().</text>
  <text x="955" y="1156" class="note">3. Gọi setTrafficLightRoad1() và setTrafficLightRoad2() để đổi đèn.</text>
  <text x="955" y="1205" class="nodeTitle">Bất biến thời gian cần giữ</text>
  <text x="955" y="1243" class="note">time_red = time_green + time_amber</text>
  <text x="955" y="1278" class="small">Nhờ bất biến này, điều kiện OR ở các biên pha xảy ra đúng lúc cả hai đường</text>
  <text x="955" y="1304" class="small">kết thúc pha tương ứng; nếu không, một đường có thể chuyển sớm hoặc bị âm bộ đếm.</text>
  <text x="955" y="1345" class="small">Mũi tên trên sơ đồ biểu diễn điều kiện trong code hiện tại, không phải nhánh lý thuyết bổ sung.</text>

  <rect x="70" y="1430" width="1660" height="42" rx="10" fill="#0f172a"/>
  <text x="900" y="1458" text-anchor="middle" style="font: 600 14px Arial, sans-serif; fill: #ffffff;">Nguồn đối chiếu: Core/Src/input_processing.c và kiến trúc FSM trong VXL_VDK_Lab_3_Buttons-Switches.pdf</text>
</svg>
